name: Build Windows EXE (Tauri 2.x)

on:
  push:
    branches: [main, telegram]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm install

      - name: Install Rust deps
        run: |
          cd src-tauri
          cargo fetch

      - name: Build Tauri app
        run: npm run tauri build
        env:
          CARGO_INCREMENTAL: 0

      - name: Show output size
        run: |
          Get-ChildItem "src-tauri/target/release/hka.exe" | Select-Object Name, @{N="Size(MB)";E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKA-Tauri-Windows-EXE
          path: |
            src-tauri/target/release/hka.exe
            src-tauri/target/release/bundle/nsis/HKA_1.0.0_x64-setup.exe
            src-tauri/target/release/bundle/msi/HKA_1.0.0_x64_en-US.msi
          retention-days: 30
